        experiencia: "Tenho mais de 4 anos em suporte técnico, quase sempre em ambientes corporativos globais e trilíngues. Comecei na Computacenter México e na Rackspace (2021–2022), administrando contas no Active Directory e configurando DNS. Depois PPG Business Services e Zebra Technologies (2023), já em suporte nível 1 para usuários de língua portuguesa. Dali passei a coordenar incidentes críticos como supervisor de Command Center na Eglobal (2023–2024), e depois AT&T e Codyfin (2024–2026), em suporte multilíngue e administração de contas. Agora trabalho na Avantika, na linha de frente do suporte nível 1.<br><br>Algo se repete em todos esses papéis: diagnóstico rápido, escalonamento quando necessário, e comunicação clara em qualquer um dos três idiomas que falo.<br><br>2021 │ Computacenter México — Service Desk Analista N1<br>2022 │ Rackspace — Suporte E-mail &amp; DNS<br>2023 │ PPG Business Services — Service Desk N1<br>2023 │ Zebra Technologies — Service Desk N1<br>2023–2024 │ Eglobal — Supervisor Command Center<br>2024–2025 │ AT&amp;T — Representante de Atendimento ao Cliente<br>2025–2026 │ Codyfin — Suporte Multilíngue (Português)<br>2026 │ Avantika — Suporte N1 (atual)",
        certificaciones: "Estou em processo de certificação em <strong>CompTIA Security+</strong>, <strong>Linux+</strong> e <strong>PenTest+</strong> — as três em andamento. É o próximo passo concreto rumo à cibersegurança, não um plano vago: a lógica é pegar o que já sei de suporte técnico e direcionar para onde quero estar.",
        skills: "<strong>Sistemas</strong><br>Windows (avançado) · Linux (conhecimento operacional, CompTIA Linux+ em andamento)<br><br><strong>Identidade e produtividade</strong><br>Active Directory · Office 365 · Hosted Exchange<br><br><strong>Redes</strong><br>Configuração de DNS · diagnóstico TCP/IP básico · resolução de conectividade<br><br><strong>Operações de TI</strong><br>Gestão de tickets · escalonamento por SLA · resposta a incidentes · suporte remoto<br><br><strong>Programação</strong><br>Python (básico) · Java (em andamento, universidade)<br><br><strong>Segurança</strong> (em desenvolvimento)<br>CompTIA Security+ e PenTest+, em andamento<br><br><strong>Idiomas</strong><br>Espanhol (nativo) · Inglês (C1) · Português (C1)",
        educacion: "Licenciatura em Informática — Universidad de Londres (2026–atual)<br>Engenharia em Segurança da Informação — Instituto Artek (2021–2022, suspensa)<br>Marketing — Centro Universitario Incarnate Word (2013–2015, incompleta)",
        proyectos: 'Fora do suporte técnico, eu construo coisas. Fundei a <strong>Nexus Labs AI</strong> em março de 2026 — uma empresa de desenvolvimento de software e serviços de TI, com registro de marca em processo junto ao IMPI (classes 41 e 42) e incorporação em andamento como Sociedad por Acciones Simplificada. Lá liderei o desenvolvimento do <strong>gestorOS</strong>, uma plataforma de ponto de venda e gestão para restaurantes, incluindo sua estratégia de preços e a documentação de conformidade com proteção de dados exigida no México. Você pode conhecê-las em <a href="https://nexuslabsai.dev" target="_blank" rel="noopener">nexuslabsai.dev</a> e <a href="https://gestoros.app" target="_blank" rel="noopener">gestoros.app</a>.',
        timeline: "2021 │ Computacenter México — Service Desk Analista N1<br>2022 │ Rackspace — Suporte E-mail &amp; DNS<br>2023 │ PPG Business Services — Service Desk N1<br>2023 │ Zebra Technologies — Service Desk N1<br>2023–2024 │ Eglobal — Supervisor Command Center<br>2024–2025 │ AT&amp;T — Representante de Atendimento ao Cliente<br>2025–2026 │ Codyfin — Suporte Multilíngue (Português)<br>2026 │ Avantika — Suporte N1 (atual)",
        blog: "Ainda não publiquei nada aqui. Quando eu escrever sobre cibersegurança ou o que estou aprendendo pelo caminho, vai aparecer neste espaço. Por enquanto, o LinkedIn é a forma mais rápida de saber.",
        privacidad: "Este site não usa cookies de rastreamento nem coleta dados pessoais. Só guardo sua preferência de idioma no navegador (localStorage) para não perguntar toda vez — nada mais.",
        contacto: 'Você pode me escrever em <a href="mailto:oportunidades@cortescalderon.com">oportunidades@cortescalderon.com</a>, ou me encontrar no <a href="https://www.linkedin.com/in/fernandocortesc/" target="_blank" rel="noopener">LinkedIn</a> e <a href="https://github.com/fernandocortescalderon" target="_blank" rel="noopener">GitHub</a>.<br><br><img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&color=245-240-232&bgcolor=18-18-16&data=https://www.linkedin.com/in/fernandocortesc/" alt="Código QR para o LinkedIn" width="110" height="110" style="border-radius:4px;margin-top:0.5rem;">',
        ayuda: "Comandos disponíveis: <strong>soy</strong> (quem sou) · <strong>experiência</strong> · <strong>certificações</strong> · <strong>skills</strong> · <strong>educacao</strong> · <strong>projetos</strong> · <strong>blog</strong> · <strong>privacidade</strong> · <strong>contato</strong> · <strong>limpar</strong>",
        sudo: "Permissão negada. Nem eu tenho acesso root à minha própria vida — mas boa tentativa. 🔒",
        unknown: (cmd) => `Comando não reconhecido: "${cmd}". Digite <strong>ajuda</strong> para ver as opções disponíveis.`
      }
    }
  };

  const synonyms = {
    soy: ['soy', 'whoami', 'who'],
    experiencia: ['experiencia', 'experience', 'experiência'],
    certificaciones: ['certificaciones', 'certifications', 'certificados', 'certificações'],
    skills: ['skills', 'habilidades', 'habilidades técnicas'],
    educacion: ['educacion', 'educación', 'education', 'educacao', 'educação'],
    proyectos: ['proyectos', 'projects', 'projetos'],
    timeline: ['timeline', 'linea de tiempo', 'línea de tiempo', 'linha do tempo'],
    blog: ['blog'],
    privacidad: ['privacidad', 'privacy', 'privacidade'],
    contacto: ['contacto', 'contact', 'contato'],
    ayuda: ['ayuda', 'help', 'ajuda'],
    limpiar: ['limpiar', 'clear', 'limpar'],
    sudo: ['sudo']
  };

  let currentLang = 'es';
  const output = document.getElementById('output');
  const input = document.getElementById('cmd-input');

  function resolveCommand(raw) {
    const norm = raw.trim().toLowerCase();
    for (const [canonical, names] of Object.entries(synonyms)) {
      if (names.includes(norm)) return canonical;
    }
    return null;
  }

  function typeWriter(el, html, speed = 10) {
    // Render as plain text typing effect, then swap to full HTML at the end
    // to preserve tags like <strong> and <a> correctly.
    const plain = html.replace(/<[^>]+>/g, '');
    let i = 0;
    const temp = document.createElement('span');
    el.appendChild(temp);
    function step() {
      if (i <= plain.length) {
        temp.textContent = plain.slice(0, i);
        i += 2;
        output.scrollTop = output.scrollHeight;
        requestAnimationFrame(() => setTimeout(step, speed));
      } else {
        temp.outerHTML = html;
        output.scrollTop = output.scrollHeight;
      }
    }
    step();
  }

  function runCommand(canonical, echo) {
    const dict = translations[currentLang];
    const block = document.createElement('div');
    block.className = 'output-block';

    if (echo !== false) {
      const echoLine = document.createElement('div');
      echoLine.className = 'echoed';
      echoLine.textContent = `${dict.promptLabel} ${echo}`;
      block.appendChild(echoLine);
    }

    if (canonical === 'limpiar') {
      output.innerHTML = '';
      return;
    }

    const resp = document.createElement('div');
    resp.className = 'response';
    block.appendChild(resp);
    output.appendChild(block);
    output.scrollTop = output.scrollHeight;

    let text;
    if (canonical && dict.responses[canonical]) {
      text = dict.responses[canonical];
    } else {
      resp.classList.add('error');
      text = dict.responses.unknown(echo || canonical);
    }
    typeWriter(resp, text, 8);
  }

  function bootIntro() {
    const dict = translations[currentLang];
    const block = document.createElement('div');
    block.className = 'output-block';
    const resp = document.createElement('div');
    resp.className = 'response';
    block.appendChild(resp);
    output.appendChild(block);
    typeWriter(resp, dict.responses.soy, 8);
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim() !== '') {
      const raw = input.value;
      const canonical = resolveCommand(raw);
      runCommand(canonical, raw);
      input.value = '';
    }
  });

  document.querySelectorAll('#pills button').forEach(btn => {
    btn.addEventListener('click', () => {
      const cmd = btn.dataset.cmd;
      runCommand(cmd, btn.textContent);
    });
  });

  function applyLang(lang) {
    currentLang = lang;
    const dict = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (dict[key] !== undefined) el.placeholder = dict[key];
    });
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    localStorage.setItem('site-lang', lang);
  }

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      applyLang(btn.dataset.lang);
      output.innerHTML = '';
      bootIntro();
    });
  });

  const savedLang = localStorage.getItem('site-lang');
  if (savedLang && translations[savedLang]) {
    currentLang = savedLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[savedLang][key] !== undefined) el.innerHTML = translations[savedLang][key];
    });
    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === savedLang);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {});
  bootIntro();
</script>
